<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>LOU LOU Kasse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Идея: фирменный бланк LOU LOU — холодный белый лист, чернила цвета эспрессо, бронза и
     тонкие золотистые линии из логотипа. Прямые углы, разрядка в заглавных, ничего лишнего. */
  --paper: #f7f9f8;
  --card: #ffffff;
  --ink: #1f1412;
  --muted: #7d6f6a;
  --line: #e4ddd7;
  --accent: #6a4b41;
  --accent-ink: #ffffff;
  --gold: #c8ab92;
  --ok: #3d6b55; --ok-bg: #e7efe9;
  --warn: #85601a; --warn-bg: #f5ecd6;
  --stop: #9c3a33; --stop-bg: #f6e2df;
  --display: "Cormorant", "Cormorant Garamond", "Times New Roman", serif;
  --body: "Jost", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 4px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { background: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 4; }
.top img { height: 52px; width: auto; display: block; }
.top .sync { margin-left: auto; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); text-align: right; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.sync.on i { background: var(--ok); } .sync.off i { background: var(--warn); } .sync.wait i { background: var(--gold); }

main { flex: 1; padding: 14px 14px 96px; display: flex; flex-direction: column; gap: 14px; }
h2 { font: 500 25px/1.15 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 6px 2px 0; text-wrap: balance; }
h3 { font: 500 11px/1.2 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 0; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0 2px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.right { margin-left: auto; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 14px 16px; border-radius: var(--r); display: flex; gap: 12px; align-items: center; width: 100%; text-decoration: none; color: inherit; }
.choice b { font-weight: 500; display: block; }
.choice span.sub { display: block; color: var(--muted); font-size: 13px; }
.choice[data-level="ok"] { border-left-color: var(--ok); }
.choice[data-level="warn"] { border-left-color: var(--warn); }
.choice[data-level="stop"] { border-left-color: var(--stop); }
.choice:hover { border-color: var(--accent); }
.big .choice { padding: 20px 18px; }
.big .choice b { font: 500 21px/1.2 var(--display); letter-spacing: .07em; text-transform: uppercase; }

.btn { border: 1px solid var(--accent); background: var(--card); color: var(--accent); padding: 10px 14px; border-radius: var(--r); font-weight: 500; font-size: 14px; letter-spacing: .02em; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 42px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); color: var(--muted); }
.btn.sm { padding: 6px 10px; font-size: 13px; min-height: 34px; }
.btn.danger { color: var(--stop); border-color: var(--stop-bg); }
.btn.pri.danger { background: var(--stop); color: #fff; border-color: var(--stop); }
.btn[disabled] { opacity: .5; cursor: default; }
.back { background: none; border: 0; color: var(--accent); padding: 4px 0; font-size: 14px; align-self: flex-start; text-decoration: none; }

.pill { display: inline-block; padding: 1px 7px; border-radius: 2px; font-size: 12px; font-weight: 500; margin: 2px 4px 0 0; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.stop { background: var(--stop-bg); color: var(--stop); }
.pill.mute { background: var(--line); color: var(--muted); }

.verdict { border-radius: var(--r); padding: 10px 14px; font-size: 14px; border-left: 3px solid; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.warn { background: var(--warn-bg); color: var(--warn); }
.verdict.stop { background: var(--stop-bg); color: var(--stop); }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.copy { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.copy .lbl { font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.copy code { font: 400 15px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-word; }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 140px; min-width: 0; letter-spacing: .03em; }
label.f input, label.f select, label.f textarea { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 16px; color: var(--ink); width: 100%; letter-spacing: 0; }
label.f textarea { min-height: 76px; resize: vertical; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.tile b { font: 500 17px/1.3 var(--body); font-variant-numeric: tabular-nums; display: block; overflow-wrap: anywhere; }
.tile.hi { border-color: var(--gold); }
.tile.hi b { font: 600 24px/1.1 var(--display); }
@media (max-width: 380px) { .tiles { grid-template-columns: 1fr 1fr; } }

.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: flex-start; }
button.item { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; font: inherit; }
button.item:first-child { border-top: 0; }
.item.tap:active { background: var(--paper); }
.item .main > span { display: block; }
.item:first-child { border-top: 0; }
.item .main { flex: 1; min-width: 0; }
.item .main b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.item .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .amt { text-align: right; font-weight: 500; }
.amt.plus { color: var(--ok); }
.item.void .main b, .item.void .amt { text-decoration: line-through; opacity: .55; }
.way { display: inline-block; min-width: 20px; text-align: center; font-size: 11px; font-weight: 600; border: 1px solid var(--gold); border-radius: 2px; padding: 0 4px; margin-right: 6px; color: var(--accent); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }

.meter { height: 6px; border-radius: 0; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.warn i { background: var(--warn); } .meter.stop i { background: var(--stop); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--gold); display: flex; justify-content: center; z-index: 5; }
nav.tabs div { display: flex; width: 100%; max-width: 600px; }
nav.tabs a { flex: 1; text-align: center; padding: 8px 2px 10px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 500; border-top: 2px solid transparent; margin-top: -1px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a[href="#more"] svg { stroke-width: 3.2; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }

.sheet-bg { position: fixed; inset: 0; background: var(--card); z-index: 10; display: flex; }
.sheet { background: var(--card); width: 100%; height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--gold); display: flex; justify-content: flex-end; padding: 6px 10px; }
.sheet-x { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--ink); font-size: 28px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.sheet-x:hover { border-color: var(--accent); }
.sheet-body { max-width: 760px; margin: 0 auto; padding: 14px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
body.noscroll { overflow: hidden; }
.sheet h2 { margin: 0; }
.err { color: var(--stop); font-size: 14px; min-height: 1em; }
.toast { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r); font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 10px 14px; font-size: 14px; border-left: 3px solid var(--warn); }
.lineitem { display: grid; grid-template-columns: 1fr 60px 88px 30px; gap: 6px; align-items: end; }
.lineitem input, .lineitem textarea { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 8px; font-size: 15px; width: 100%; min-width: 0; }
.lineitem button { border: 0; background: none; color: var(--muted); font-size: 20px; padding: 6px 0; }
.total { font: 600 26px/1 var(--display); }
@media (prefers-reduced-motion: no-preference) {
  .sheet-body { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

table.mt { width: 100%; border-collapse: collapse; font-size: 14px; }
table.mt th { text-align: right; font: 500 10px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.mt th:first-child, table.mt td:first-child { text-align: left; }
table.mt td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line); }
table.mt tfoot td { font-weight: 600; border-top: 1px solid var(--accent); border-bottom: 0; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font: inherit; }

.itemwrap { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
select.tpl { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px; font-size: 14px; color: var(--muted); width: 100%; }
.sums { border: 1px solid var(--gold); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.sums .strong { font-weight: 600; border-top: 1px solid var(--line); padding-top: 4px; }
label.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
label.chk input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: 0 0 auto; }
/* в колонке поля не растягиваются по высоте */
.sheet-body > label.f, .sheet-body > div > label.f, main label.f { flex: 0 0 auto; }
.sheet-body .row > label.f, main .row > label.f { flex: 1 1 140px; }

/* ---------- новые элементы ---------- */
.col { display: flex; flex-direction: column; gap: 6px; }
.grow { flex: 1 1 auto !important; }
.row.wrap .btn { flex: 1 1 auto; }
.row.strong { font-weight: 600; font-size: 17px; border-top: 1px solid var(--accent); padding-top: 8px; }
.hello { position: relative; margin: 2px 2px 0; display: flex; flex-direction: column; gap: 2px; }
.hello b { font: 600 26px/1.15 var(--display); color: var(--ink); }
.hello span { font-size: 14px; color: var(--muted); }
.sprig { display: none; fill: none; stroke: var(--sage, #93a98f); stroke-width: 1.4; stroke-linecap: round; }
.sprig circle { fill: var(--rose, #e3bfb3); stroke: none; }
.hello .sprig { position: absolute; right: 0; top: -2px; width: 120px; height: 40px; }
.allok { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--ok); }
.allok .sprig { width: 60px; height: 20px; flex: 0 0 auto; }
.qbtn svg { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.qbtn.cam { background: var(--accent); color: #fff; border-color: var(--accent); }
.qbtn.cam svg { stroke: #fff; }
.att .item { align-items: center; }
.att .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--warn); }
.att .att-stop .dot { background: var(--stop); } .att .att-info .dot { background: var(--gold); }
.chev { color: var(--muted); font-size: 22px; line-height: 1; }
.lim { margin: 0; }
.tiles.t3 { grid-template-columns: repeat(3, 1fr); }
.card .tiles .tile { border: 0; background: var(--paper); }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qbtn { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 4px; font-size: 13px; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.qbtn b { font: 400 24px/1 var(--display); color: var(--accent); }
.qbtn:active { border-color: var(--accent); }
.tile em { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.tile em .red, .red { color: var(--stop); font-style: normal; }
button.tile { text-align: left; font: inherit; color: inherit; width: 100%; }
.tile.warnt { border-color: var(--stop); }
.tile.warnt b { color: var(--stop); }
.tiles.t5 .tile b { font-size: 15px; }
.tiles.t5 .tile.hi b { font-size: 21px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; font-size: 14px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg.chips { border: 0; background: none; gap: 6px; flex-wrap: wrap; overflow: visible; }
.seg.chips button { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px; background: var(--card); }
.seg.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.mh { margin: 14px 0 2px !important; }
details.card > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: '▾'; margin-left: auto; color: var(--muted); }
details.card[open] > summary::after { content: '▴'; }
details > summary h3 { display: inline; }
.gate { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
.pre { white-space: pre-line; }
.big { font: 600 30px/1.1 var(--display); }
.big.plus { color: var(--ok); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
dl.kv dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
table.euer td .sub { display: block; font-size: 12px; color: var(--muted); }
table.euer tr.warnr td { color: var(--warn); }
.item .btn.sm { flex: 0 0 auto; align-self: center; }
/* предпросмотр счёта: лист A4 в уменьшенном виде */
.paperwrap { overflow-x: auto; border: 1px solid var(--line); background: #e9e6e3; padding: 10px; border-radius: var(--r); }
.paper { background: #fff; color: #000; width: 595px; min-height: 600px; margin: 0 auto; padding: 40px 44px; font: 8.5px/1.5 Arial, "Liberation Sans", sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.paper .ph { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 26px; }
.paper .ph img { width: 82px; }
.paper .r { text-align: right; }
.paper p { margin: 0 0 12px; }
.paper h4 { font-size: 13.6px; margin: 14px 0 8px; }
.paper table.meta td { padding: 0 60px 0 0; }
.paper table.pos { width: 100%; border-collapse: collapse; margin: 14px 0 20px; }
.paper table.pos th { background: #efe9e6; text-align: left; padding: 7px 4px; border-top: .6px solid #999; border-bottom: 1.5px solid #000; }
.paper table.pos td { padding: 7px 4px; border-bottom: .6px solid #999; vertical-align: bottom; }
.paper table.pos td.c { text-align: center; } .paper table.pos td.r { text-align: right; }
.paper table.pos tr.t td { border-bottom: 0; padding: 2px 4px; }
.paper table.pos tr.tt td { border-bottom: 1.5px solid #000; border-top: 1.5px solid #000; }
@media (max-width: 380px) { .quick { grid-template-columns: repeat(2, 1fr); } }

.sheet h2.plain { text-transform: none; letter-spacing: 0; font: 600 22px/1.25 var(--body); }
.toast .lnk { color: #fff; }

/* ================= оформления ================= */
/* «Мягкий» и «Цветочный»: кремовый фон, скруглённые карточки с тенью, таблетки-кнопки */
.theme-paper, .theme-floral { --paper: #f8f1ec; --card: #fffdfb; --line: #eee2da; --r: 14px; --accent: #7a5446; --gold: #d8b9a4; --rose: #e8c3b6; --sage: #93a98f; }
.theme-paper .top, .theme-floral .top { background: var(--card); border-bottom: 0; box-shadow: 0 2px 10px rgba(110, 70, 55, .07); }
.theme-paper .card, .theme-floral .card, .theme-paper .choice, .theme-floral .choice, .theme-paper .gate, .theme-floral .gate { border: 0; box-shadow: 0 1px 2px rgba(110, 70, 55, .05), 0 6px 18px rgba(110, 70, 55, .07); }
.theme-paper .choice, .theme-floral .choice { border-left: 0; }
.theme-paper h2, .theme-floral h2, .theme-boutique h2 { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 30px; }
.theme-paper h3, .theme-floral h3 { text-transform: none; letter-spacing: .01em; font: 600 15px/1.25 var(--body); color: var(--accent); }
.theme-paper .btn, .theme-floral .btn { border-radius: 999px; }
.theme-paper input, .theme-floral input, .theme-paper select, .theme-floral select, .theme-paper textarea, .theme-floral textarea { border-radius: 12px; }
.theme-paper .pill, .theme-floral .pill { border-radius: 999px; padding: 1px 9px; }
.theme-paper .verdict, .theme-floral .verdict { border-left: 0; border-radius: 12px; }
.theme-paper .qbtn, .theme-floral .qbtn { border: 0; border-radius: 18px; box-shadow: 0 1px 2px rgba(110, 70, 55, .05), 0 6px 18px rgba(110, 70, 55, .07); }
.theme-paper .tile span, .theme-floral .tile span { text-transform: none; letter-spacing: .02em; font-size: 12px; }
.theme-paper .card .tiles .tile:nth-child(1), .theme-floral .card .tiles .tile:nth-child(1) { background: #f4ebe3; }
.theme-paper .card .tiles .tile:nth-child(2), .theme-floral .card .tiles .tile:nth-child(2) { background: #f7e9e4; }
.theme-paper .card .tiles .tile.hi, .theme-floral .card .tiles .tile.hi { background: #f1dfd6; }
.theme-paper .meter, .theme-floral .meter { border-radius: 999px; height: 8px; }
.theme-paper .meter i, .theme-floral .meter i { border-radius: 999px; }
.theme-paper nav.tabs, .theme-floral nav.tabs { background: var(--card); border-top: 0; box-shadow: 0 -2px 12px rgba(110, 70, 55, .07); }
.theme-paper nav.tabs a[aria-current], .theme-floral nav.tabs a[aria-current] { border-top-color: transparent; }
.theme-paper nav.tabs a[aria-current] svg, .theme-floral nav.tabs a[aria-current] svg { background: #f1dfd6; border-radius: 999px; padding: 2px 14px; width: 54px; }
.theme-paper .sheet, .theme-floral .sheet { background: var(--paper); }
.theme-paper .seg, .theme-floral .seg { border-radius: 999px; }
/* «Цветочный»: веточки и розовые акценты */
.theme-floral .sprig { display: block; }

<script>
/* LOU LOU Kasse — расчётное ядро. Все суммы — целые центы. */
(function (root) {
  'use strict';

  /* "37,80" | "37.80" | "1.234,56" | "1234" -> центы; null если не число */
  function parseMoney(s) {
    if (typeof s === 'number') return Number.isFinite(s) ? Math.round(s * 100) : null;
    s = String(s == null ? '' : s).replace(/\s|€|EUR/gi, '');
    if (!s) return null;
    var neg = false;
    if (s[0] === '-') { neg = true; s = s.slice(1); }
    var intPart, frac = '', m;
    if (/^\d+$/.test(s)) { intPart = s; }                                   // 1234
    else if ((m = /^(\d+)[.,](\d{1,2})$/.exec(s))) { intPart = m[1]; frac = m[2]; }   // 37,80 | 37.8
    else if ((m = /^(\d{1,3}(?:\.\d{3})+)(?:,(\d{1,2}))?$/.exec(s))) {          // 1.234 | 1.234,56
      intPart = m[1].replace(/\./g, ''); frac = m[2] || '';
    } else if ((m = /^(\d{1,3}(?:,\d{3})+)\.(\d{1,2})$/.exec(s))) {             // 1,234.56
      intPart = m[1].replace(/,/g, ''); frac = m[2];
    } else return null;                                                      // всё остальное — не сумма
    var cents = parseInt(intPart, 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (!Number.isSafeInteger(cents)) return null;
    return neg ? -cents : cents;
  }

  /* центы -> "1.234,56" */
  function fmtMoney(c) {
    c = Math.round(c || 0);
    var neg = c < 0; if (neg) c = -c;
    var i = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var f = ('0' + (c % 100)).slice(-2);
    return (neg ? '-' : '') + i + ',' + f;
  }

  /* количество "2" | "1,5" -> сотые доли; null если плохо */
  function parseQty(s) {
    var c = parseMoney(s);
    return c == null || c <= 0 ? null : c;
  }
  function fmtQty(h) { if (h % 100 === 0) return String(h / 100); var t = fmtMoney(h); return h % 10 === 0 ? t.slice(0, -1) : t; }

  function lineTotal(qtyHundredths, priceCents) {
    return Math.round(qtyHundredths * priceCents / 100);
  }
  function invoiceTotal(items) {
    return (items || []).reduce(function (s, it) { return s + lineTotal(it.qty, it.price); }, 0);
  }

  /* номер счёта = ГГГГММ (месяц даты счёта) + порядковый номер из 3 цифр внутри месяца.
     Следующий = наибольший уже выданный в этом месяце + 1; учитывается и lastIssued
     (последний номер, выданный вне приложения). */
  function nextInvoiceNo(invoices, dateIso, lastIssued) {
    var prefix = String(dateIso || '').slice(0, 7).replace('-', '');
    if (!/^\d{6}$/.test(prefix)) return '';
    var max = 0;
    var see = function (no) {
      no = String(no == null ? '' : no);
      if (/^\d{9}$/.test(no) && no.slice(0, 6) === prefix) { var n = parseInt(no.slice(6), 10); if (n > max) max = n; }
    };
    (invoices || []).forEach(function (iv) { see(iv.no); });
    see(lastIssued);
    if (max >= 999) return '';
    return prefix + ('00' + (max + 1)).slice(-3);
  }

  /* итоговый счёт: полная стоимость минус оплаченные предоплаты.
     Инвариант: gross === ded + rest. Остаток не может быть отрицательным. */
  function schlussTotals(items, deductions) {
    var gross = invoiceTotal(items), ded = 0;
    (deductions || []).forEach(function (d) { ded += d.amount; });
    var rest = gross - ded;
    return { gross: gross, ded: ded, rest: rest, ok: rest >= 0 && gross === ded + rest };
  }
  function addDays(iso, n) {
    var p = String(iso || '').split('-').map(Number); if (p.length !== 3 || !p[0]) return '';
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  }

  var TYPES = ['einnahme', 'ausgabe', 'entnahme', 'einlage'];
  var WAYS = ['G', 'P', 'E', 'B'];

  function validEntry(e) {
    return !!e && TYPES.indexOf(e.type) >= 0 && WAYS.indexOf(e.way) >= 0 &&
      Number.isSafeInteger(e.amount) && e.amount !== 0 &&
      /^\d{4}-\d{2}-\d{2}$/.test(e.date || '');
  }

  function emptySums() { return { einnahme: 0, ausgabe: 0, entnahme: 0, einlage: 0, gewinn: 0 }; }

  /* суммы по записям, чья дата начинается с prefix ("2026-11" или "2026") */
  function sums(entries, prefix) {
    var s = emptySums();
    (entries || []).forEach(function (e) {
      if (!validEntry(e)) return;
      if (prefix && e.date.indexOf(prefix) !== 0) return;
      s[e.type] += e.amount;
    });
    s.gewinn = s.einnahme - s.ausgabe;
    return s;
  }

  /* как запись меняет остаток рабочего счёта (только way === 'G') */
  function bankEffect(e) {
    if (!validEntry(e) || e.way !== 'G') return 0;
    return (e.type === 'einnahme' || e.type === 'einlage') ? e.amount : -e.amount;
  }

  function lastDayOfMonth(ym) {
    var y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(5, 7), 10);
    var d = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return ym + '-' + ('0' + d).slice(-2);
  }

  /* расчётный остаток рабочего счёта на конец дня until */
  function bankBalance(entries, openingCents, openingDate, until) {
    var b = openingCents || 0;
    (entries || []).forEach(function (e) {
      if (!validEntry(e)) return;
      if (openingDate && e.date < openingDate) return;
      if (until && e.date > until) return;
      b += bankEffect(e);
    });
    return b;
  }

  /* сверка: остаток по выписке против расчётного на конец месяца */
  function reconcile(entries, openingCents, openingDate, ym, statementCents) {
    var computed = bankBalance(entries, openingCents, openingDate, lastDayOfMonth(ym));
    if (statementCents == null) return { computed: computed, diff: null, ok: null };
    var diff = statementCents - computed;

  /* ---------- выписка банка ---------- */
  var bankRes = null, bankRows = null;
  function reopenBank() { if (!bankRows) return; sheetBank(true); bankRes = C.matchBank(bankRows, S.entries); drawBank(); }
  function sheetBank(keep) {
    if (!keep) { bankRes = null; bankRows = null; }
    openSheet('<h2>Выписка банка</h2><p class="hint">Sparkasse Online-Banking → Umsätze → Export → <b>CSV-CAMT</b>. Загрузите файл: приложение сравнит операции рабочего счёта с журналом (та же сумма, дата ±5 дней).</p>' +
      '<label class="f" for="bank-file">Файл выписки (.csv)<input id="bank-file" type="file" accept=".csv,text/csv,text/plain"></label><div id="bank-out"></div>');
  }
  function decodeBank(buf) {
    var t = new TextDecoder('utf-8').decode(buf);
    if (t.indexOf('�') >= 0) { try { t = new TextDecoder('windows-1252').decode(buf); } catch (e) {} }
    return t;
  }
  function bankFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var p = C.parseBankCsv(decodeBank(r.result)), out = $('#bank-out'); if (!out) return;
      if (p.error) { out.innerHTML = '<p class="err">' + esc(p.error) + '</p>'; return; }
      bankRows = p.rows; bankRes = C.matchBank(p.rows, S.entries); drawBank();
    };
    r.readAsArrayBuffer(file);
  }
  function drawBank() {
    var m = bankRes, out = $('#bank-out'); if (!m || !out) return;
    var rowB = function (x, i) { return '<div class="item"><span class="main"><b>' + esc(x.party || x.kind || 'Операция') + '</b><span class="meta">' + esc(C.deDate(x.date)) + ' · ' + esc(x.text).slice(0, 90) + '</span></span><span class="amt num ' + (x.amount >= 0 ? 'plus' : 'minus') + '">' + eur(x.amount) + '</span><button class="btn sm" data-act="bank-add" data-i="' + i + '">Внести</button></div>'; };
    out.innerHTML = '<p>Период ' + esc(C.deDate(m.from)) + ' — ' + esc(C.deDate(m.to)) + ': ' + (m.matched.length + m.missing.length) + ' операций, сумма движения ' + eur(m.sumBank) + '.</p>' +
      '<div class="verdict ok">Совпадают с журналом: ' + m.matched.length + '</div>' +

      (!m.missing.length && !m.extra.length ? '<p><span class="pill ok">Всё сходится</span> каждая операция выписки есть в журнале.</p>' : '');
  }

      '<p class="hint">Архив ZIP: журнал (CSV), отчёт EÜR (CSV), список счетов (CSV), все счета года в PDF и список документов к расходам со ссылками на Google Drive.</p>' +
      '<p class="err" role="alert"></p><div class="row wrap"><button class="btn" data-act="pack-make" data-k="dl">Скачать ZIP</button>' + (navigator.share ? '<button class="btn" data-act="pack-make" data-k="share">Отправить…</button>' : '') + '<button class="btn pri" data-act="pack-make" data-k="drive">В Google Drive</button></div>');
  }
  function makePack(y) {
    if (!window.JSZip) return Promise.reject({ message: 'модуль ZIP не загрузился, проверьте подключение' });
    var z = new window.JSZip(), r = C.euerReport(S.entries, y), st = C.stornoedIds(S.entries);

  /* ---------- резервная копия ---------- */

      '<label class="f" for="bk-file">Файл копии (.json)<input id="bk-file" type="file" accept=".json,application/json"></label>');

  var pendingRestore = null;
  function restore(file) {
    var r = new FileReader();
    r.onload = function () {
      var d; try { d = JSON.parse(r.result); } catch (e) { return toast('Это не файл резервной копии'); }
      if (!d || d.app !== 'loulou-kasse' || !Array.isArray(d.entries) || !Array.isArray(d.invoices)) return toast('Это не файл резервной копии');

      openSheet('<h2>Восстановление данных</h2><p class="hint">В файле ' + es.length + ' записей журнала, ' + ivs.length + ' счетов' + (ts.length ? ', ' + ts.length + ' шаблонов' : '') + ' от ' + esc(String(d.savedAt || '').slice(0, 10)) + '. Записи с теми же номерами будут заменены, остальные добавлены.' +
        (S.entries.length || S.invoices.length ? ' Сейчас в приложении ' + S.entries.length + ' записей и ' + S.invoices.length + ' счетов.' : '') + '</p><p class="err" role="alert"></p>' +
        '<div class="row"><button class="btn ghost" data-act="sheet-close">Отмена</button><button class="btn pri right" data-act="bk-ok">Восстановить</button></div>');
    };

  function doRestore(btn) {
    var p = pendingRestore; if (!p) return; busy(btn, true);

    p.ivs.forEach(function (v) { chain = chain.then(function () { return putInvoice(v); }); });
    p.ts.forEach(function (t) { chain = chain.then(function () { return putTemplate(t); }); });
    if (p.settings && Object.keys(p.settings).length) chain = chain.then(function () { return putSettings(Object.assign({}, p.settings, S.settings.drive ? { drive: S.settings.drive } : {})); });
    if (p.bank && p.bank.statements) chain = chain.then(function () { return putBank({ statements: p.bank.statements }); });
    chain.then(function () { pendingRestore = null; closeSheet(); toast('Данные восстановлены: ' + p.es.length + ' записей, ' + p.ivs.length + ' счетов'); }).catch(function (e) { busy(btn, false); setErr(dbErr(e)); });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'j-month' && (t.value === 'all' || /^\d{4}-\d{2}$/.test(t.value))) { month = t.value; drawMain(); }
    else if (t.id === 'e-type') fillWays();
    else if (t.id === 'e-tpl' && t.value) applyTpl(t.value);
    else if (t.id === 'iv-kind') kindChanged();
    else if (t.id === 'iv-duesel') dueChanged();
    else if (t.id === 'iv-client' && t.value !== '') { var c = C.clientsFrom(S.invoices)[parseInt(t.value, 10)]; if (c) $('#iv-rcpt').value = c.rcpt; }
    else if (t.dataset && t.dataset.it === 'tpl' && t.value) { var ta = t.closest('[data-wrap]').querySelector('[data-it=text]'); ta.value = t.value; t.value = ''; ta.focus(); updTotal(); }
    else if (t.closest && t.closest('#iv-prepay') && t.type === 'checkbox') {
      var rc = document.getElementById('iv-rcpt'), v0 = findIv(t.value);
      if (t.checked && v0 && !rc.value.trim()) rc.value = v0.rcpt || ivName(v0);
      updTotal();
    }
    else if (t.id === 'iv-date') setAuto('iv-no', C.nextInvoiceNo(S.invoices, t.value, S.settings.lastIssued));
    else if (t.id === 'ev-cat') patchEntry(t.dataset.id, { cat: t.value || null }).then(function () { toast('Статья сохранена'); });
    else if (t.id === 'ev-file' && t.files && t.files[0]) {
      var f = t.files[0], e = S.entries.find(function (x) { return x.id === t.dataset.id; });
      withDrive(function () { return attachBeleg(e, f).then(function () { toast('Документ сохранён в Drive: Belege › ' + e.date.slice(0, 7)); if (sheetOpen()) sheetEntryView(e.id); }); });
    }
    else if (t.id === 'eb-j') { $('#eb-jw').hidden = !t.checked; }
    else if (t.id === 'grad-on') { try { localStorage.setItem('kasse-grad', t.checked ? '1' : '0'); } catch (e) {} applyAccent(); drawMain(); }
    else if (t.id === 'euer-y') sheetEuer(t.value);
    else if (t.id === 'pack-y') { /* выбор года читается при нажатии */ }
    else if (t.id === 'bank-file' && t.files && t.files[0]) bankFile(t.files[0]);
    else if (t.id === 'bk-file' && t.files && t.files[0]) { restore(t.files[0]); t.value = ''; }
  });
  document.addEventListener('focusout', function () { setTimeout(function () { if (dirty && !sheetOpen()) { var a = document.activeElement; if (!(a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) drawMain(); } }, 60); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheetOpen()) closeSheet(); });
  window.addEventListener('popstate', onPop);
  window.addEventListener('hashchange', route);   /* ручной ввод адреса */
  navInit();
  document.addEventListener('touchstart', function () {}, { passive: true });   /* включает :active (эффект нажатия) на сенсорных экранах */
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  applyTheme();
  boot();
})();

</script>
</body>
</html>
